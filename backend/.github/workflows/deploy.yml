name: deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Which environment to deploy? (dev, test or prod)
        required: true
        options:
          - dev
          - qa
          - prd

      run_migration:
        type: choice
        description: Run MongoDB migration?
        required: false
        default: none
        options:
          - none
          - up
          - down
          - downAll
          - status

permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - if: inputs.environment == 'prd' && github.ref != 'refs/heads/main'
        name: Make sure isnt prod deploying from branch
        run: exit 1

      - name: Git clone the repository
        uses: actions/checkout@v3

      - name: Setup npmrc
        run: |
          echo "@nrldigitaltechnology:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${{ secrets.SVC_RELEASE_TOKEN }}" > ~/.npmrc
          
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      
      - name: CDK setup
        run: cd cdk && npm install

      - name: Setup formsBackend
        run: npm install

      - run: npm run build
        env:
          MONGO_URI: ${{ vars.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME }}
          REGION: ap-southeast-2
          IS_LOCAL: "false"

      - name: Create env file
        if: inputs.run_migration != 'none'
        run: |
          touch .env
          # Use proper quoting and escaping for special characters
          printf 'MONGO_URI="%s"\n' "$(echo "${{ vars.MONGO_URI }}" | tr -d '\r\n')" >> .env
          printf 'MONGO_DB_NAME="%s"\n' "$(echo "${{ vars.MONGO_DB_NAME }}" | tr -d '\r\n')" >> .env
          cat .env

      - name: Export environment variables
        if: inputs.run_migration != 'none'
        run: |
          export MONGO_URI=${{ vars.MONGO_URI }}
          export MONGO_DB_NAME=${{ vars.MONGO_DB_NAME }}
          echo "Exported environment variables:"
          printenv | grep -E "MONGO_URI|MONGO_DB_NAME"

      - name: build
        run: |
          if jq -e '.scripts.build' package.json ; then
            NODE_ENV=dev npm run build
          fi
       
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::092874949167:role/github-actions-${{ github.event.repository.name }}
          aws-region: ap-southeast-2

      - name: cdk deploy
        run: |
          cd cdk && npm run cdk deploy "${{inputs.environment}}-*"

      - name: Run migration
        if: inputs.run_migration != 'none'
        env:
          MONGO_URI: ${{ vars.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME }}
          REGION: ap-southeast-2
          IS_LOCAL: "false"
        run: |
          npx ts-node -r tsconfig-paths/register libs/common/src/database/migrate.ts ${{ inputs.run_migration }}
          